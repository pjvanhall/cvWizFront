<div class="matrix-container">
  @if (isBusy) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <mat-card>
    <mat-card-header>
      <mat-icon mat-card-avatar>grid_on</mat-icon>
      <mat-card-title>Techniek Matrix</mat-card-title>
      <mat-card-subtitle>Skills and levels</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="lookup-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Matrix ID</mat-label>
          <input matInput type="number" [(ngModel)]="matrixLookupId" [disabled]="isBusy">
        </mat-form-field>
        <button mat-stroked-button color="primary" (click)="loadMatrix()" [disabled]="isBusy">
          <mat-icon>search</mat-icon> Load
        </button>
      </div>

      <div class="matrix-tools">
        <mat-form-field appearance="outline">
          <mat-label>Category</mat-label>
          <input matInput [(ngModel)]="matrixCategory" [disabled]="isBusy">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Techniek</mat-label>
          <input matInput [(ngModel)]="matrixTechnique" [disabled]="isBusy">
        </mat-form-field>
        <div class="matrix-buttons">
          <button mat-raised-button color="primary" (click)="addMatrixCategory()" [disabled]="isBusy">
            <mat-icon>add</mat-icon> Category
          </button>
          <button mat-stroked-button color="primary" (click)="addMatrixTechnique()" [disabled]="isBusy">
            <mat-icon>add</mat-icon> Technique
          </button>
        </div>
      </div>

      <div class="matrix-table-wrap mat-elevation-z2">
        @if (loadedMatrix) {
          <table mat-table [dataSource]="flattenedMatrixData" class="full-width">

            <ng-container matColumnDef="category">
              <th mat-header-cell *matHeaderCellDef> Category </th>
              <td mat-cell *matCellDef="let row"> {{row.category}} </td>
            </ng-container>

            <ng-container matColumnDef="techniek">
              <th mat-header-cell *matHeaderCellDef> Techniek </th>
              <td mat-cell *matCellDef="let row">
                <span [class.muted]="row.techniek === 'No technieken'">{{row.techniek}}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="level">
              <th mat-header-cell *matHeaderCellDef> Level </th>
              <td mat-cell *matCellDef="let row"> {{row.level}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell empty-cell" colspan="3">No matrix rows.</td>
            </tr>
          </table>
        } @else {
          <div class="empty-state">
            <mat-icon>table_chart</mat-icon>
            <p>No matrix loaded.</p>
          </div>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
