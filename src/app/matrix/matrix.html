<div class="matrix-container">
  @if (isBusy) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <mat-card>
    <mat-card-header style="display: flex; align-items: center;">
      <mat-icon mat-card-avatar>grid_on</mat-icon>
      <div style="flex: 1;">
        <mat-card-title>Techniek Matrix</mat-card-title>
        <mat-card-subtitle>Skills and levels</mat-card-subtitle>
      </div>
      <button mat-raised-button color="primary" (click)="addNewCategory()" [disabled]="isBusy">
        <mat-icon>add</mat-icon> Add Category
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="matrix-table-wrap mat-elevation-z2">
        <table mat-table [dataSource]="matrixData" class="full-width">

          <!-- Category Column -->
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef> Category </th>
            <td mat-cell *matCellDef="let row"> 
              <span *ngIf="row.isCategory"><strong>{{row.category}}</strong></span>
            </td>
          </ng-container>

          <!-- Technique Column -->
          <ng-container matColumnDef="technique">
            <th mat-header-cell *matHeaderCellDef> Technique </th>
            <td mat-cell *matCellDef="let row"> 
              <span *ngIf="!row.isCategory">{{row.technique}}</span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" (click)="editRow(row)" title="Edit Name" [disabled]="isBusy">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteRow(row)" title="Delete" [disabled]="isBusy">
                <mat-icon>delete</mat-icon>
              </button>
              <button *ngIf="row.isCategory" mat-icon-button color="accent" (click)="addTechniqueToCategory(row)" title="Add Technique to Category" [disabled]="isBusy">
                <mat-icon>add_circle_outline</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" [ngClass]="{'category-row': row.isCategory}"></tr>
          
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell empty-cell" colspan="3">No combinations found.</td>
          </tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
