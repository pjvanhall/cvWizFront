<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login to CV Wizard</mat-card-title>
      <mat-card-subtitle>Enter your credentials to continue</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-progress-bar *ngIf="isBusy" mode="indeterminate" class="loading-bar"></mat-progress-bar>
      
      <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="e.g. j.doe">
          <mat-error *ngIf="loginForm.controls.username.hasError('required')">Username is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="loginForm.controls.password.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <mat-checkbox formControlName="isFirstLogin" color="primary">
          This is my first login (Start CV Setup)
        </mat-checkbox>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-flat-button color="primary" [disabled]="isBusy" (click)="login()">Login</button>
    </mat-card-actions>
  </mat-card>
</div>
