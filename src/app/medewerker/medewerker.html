<div class="medewerker-container">
  @if (isBusy) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <mat-card>
    <mat-card-header>
      <mat-icon mat-card-avatar>people</mat-icon>
      <mat-card-title>Consultants</mat-card-title>
      <mat-card-subtitle>Manage all consultants</mat-card-subtitle>
      <span class="spacer"></span>
      <button mat-raised-button color="primary" (click)="openAddDialog()" [disabled]="isBusy">
        <mat-icon>add</mat-icon> Add Consultant
      </button>
    </mat-card-header>

    <mat-card-content>
      <table mat-table [dataSource]="consultants" class="mat-elevation-z0 consultant-table">
        
        <!-- Voornaam Column -->
        <ng-container matColumnDef="voornaam">
          <th mat-header-cell *matHeaderCellDef> First Name </th>
          <td mat-cell *matCellDef="let element"> {{element.voornaam}} </td>
        </ng-container>

        <!-- Achternaam Column -->
        <ng-container matColumnDef="achternaam">
          <th mat-header-cell *matHeaderCellDef> Last Name </th>
          <td mat-cell *matCellDef="let element"> {{element.achternaam}} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="emailAdres">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let element"> {{element.emailAdres}} </td>
        </ng-container>

        <!-- Telefoon Column -->
        <ng-container matColumnDef="telefoon">
          <th mat-header-cell *matHeaderCellDef> Phone </th>
          <td mat-cell *matCellDef="let element"> {{element.telefoon}} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="openEditDialog(element)" title="Edit Consultant">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      @if (!isBusy && consultants.data.length === 0) {
        <div class="no-data">
          No consultants found.
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
